# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build
on:
  workflow_call:
    inputs:
      ref:
        description: |
          The Git reference from which to clone the project.

          This can be any valid Git commit-ish (e.g. a SHA, a ref, a tag, and so
          on).

          Defaults to the SHA that caused the workflow to be triggered. If that
          is unavailable the fully formed reference of the branch or tag that
          triggered the workflow is used. If that is unavailable the repository
          default branch is used.
        type: string
        required: false
        default:
          ${{github.sha || github.ref ||
          github.event.repository.default_branch}}
      release-build:
        description: |
          Whether to make a release build.
        type: boolean
        default: false
        required: false
      upload-artifacts:
        description: |
          Whether to upload artifacts.

          Defaults to 'true'.
        type: boolean
        required: false
        default: true
      artifact-retention-days:
        description: |
          The duration, in days, to retain artifacts for.

          Defaults to '0' which defaults to the value configured for the
          repository.
        type: number
        required: false
        default: 0
    outputs:
      artifact-id:
        description: |
          The ID of the generated artifacts.
        value: ${{jobs.build.outputs.artifact-id}}
      artifact-name:
        description: |
          The name of the generated artifacts.
        value: ${{jobs.build.outputs.artifact-name}}
      artifact-url:
        description: |
          The URL from which the generated artifacts can be downloaded.
        value: ${{jobs.build.outputs.artifact-url}}
    secrets:
      github-token:
        description: |
          The token to use when making authenticated calls to the GitHub API.
        required: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      # -- Needed to clone the repository
      contents: read
    outputs:
      artifact-id: ${{steps.upload-artifacts.outputs.artifact-id}}
      artifact-name: dist
      artifact-url: ${{steps.upload-artifacts.outputs.artifact-url}}
    steps:
      - id: checkout-repository
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.ref}}
          lfs: true
          submodules: recursive
          token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
      - id: build
        name: Build
        env:
          SCRIPT_ARGS: ${{inputs.release-build && '--release' || ''}}
        run: ./create-pack.sh ${SCRIPT_ARGS}
      - id: upload-artifacts
        name: Upload artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pack
          path: '*.zip'
          compression-level: 0
          if-no-files-found: error

          retention-days: ${{inputs.artifact-retention-days}}
