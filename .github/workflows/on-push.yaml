# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: On Push
on:
  push:
concurrency:
  group: on-push-${{github.ref_name}}
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
jobs:
  build:
    name: Build
    permissions:
      # -- To clone repository
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{github.sha}}
      release-build: false
      upload-artifacts: true
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  lint:
    name: Lint
    permissions:
      # -- Needed to clone the repository
      contents: read
    uses: ./.github/workflows/lint.yaml
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  spell-check:
    name: Spell Check
    permissions:
      # -- Needed to clone the repository
      contents: read
    uses: ./.github/workflows/spell-check.yaml
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
